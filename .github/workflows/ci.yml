name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install React dependencies
        run: npm ci

      - name: Lint React app
        run: npm run lint

      - name: Test React app
        run: npm run test

      - name: Build React app
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder

  angular:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tarot-angular
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tarot-angular/package-lock.json

      - name: Install Angular dependencies
        run: npm ci

      - name: Test @tarot/core
        run: npm run test

      - name: Build Angular web
        run: npm run build:web
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder

      - name: Build Angular admin
        run: npm run build:admin
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder

  supabase-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate SQL migrations exist
        run: |
          test -f supabase/schema.sql
          test -f supabase/migrations/20260607_xp_and_comments.sql
          test -f supabase/migrations/20260609_user_streaks.sql
          test -f supabase/config.toml
